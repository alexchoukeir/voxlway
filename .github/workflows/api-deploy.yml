name: API Deployment

on:
  push:
    branches: [main]
    paths:
      - 'apps/api/**'

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    name: Deploy API to AWS
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v2

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_IAM_ROLE }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: amazon-ecr-login
        uses: aws-actions/amazon-ecr-login@v2
      
      - name: Build and push Docker image to ECR
        env:
          ECR_REGISTRY: ${{ steps.amazon-ecr-login.outputs.registry }}
          ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG apps/api
          docker tag $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG $ECR_REGISTRY/$ECR_REPOSITORY:latest
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest
      
      - name: Deploy to EC2
        env:
          ECR_REGISTRY: ${{ steps.amazon-ecr-login.outputs.registry }}
          ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          WORKER: ${{ secrets.WORKER }}
          INSTANCE_ID: ${{ secrets.INSTANCE_ID }}
        run: |
          COMMAND_ID=$(aws ssm send-command --instance-ids $INSTANCE_ID --document-name "AWS-RunShellScript" \
            --parameters '{"commands":[
              "aws ecr get-login-password --region '"$AWS_REGION"' | docker login --username AWS --password-stdin '"$ECR_REGISTRY"'",
              "docker pull '"$ECR_REGISTRY"'/'"$ECR_REPOSITORY"':latest",
              "docker run --rm --env ENVIRONMENT=production --env-file /etc/games/production.env '"$ECR_REGISTRY"'/'"$ECR_REPOSITORY"':latest /app/.venv/bin/alembic upgrade head",
              "sudo systemctl restart '"$ECR_REPOSITORY"' '"$WORKER"'",
              "docker image prune -f",
              "echo API Deployment complete"
            ]}' \
            --region $AWS_REGION --query 'Command.CommandId' --output text)
          
          aws ssm wait command-executed --command-id $COMMAND_ID --instance-id $INSTANCE_ID --region $AWS_REGION

          STATUS=$(aws ssm get-command-invocation --command-id $COMMAND_ID --instance-id $INSTANCE_ID --region $AWS_REGION \
            --query 'Status' --output text)

          echo "Status: $STATUS"

          if [ "$STATUS" != "Success" ]; then
            aws ssm get-command-invocation --command-id $COMMAND_ID --instance-id $INSTANCE_ID --region $AWS_REGION \
              --query 'StandardErrorContent' --output text
            exit 1
          fi
